<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Journal | Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dark Theme Default */
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --bg-card-hover: #2a2a2a;
            --primary: #7c4dff;
            --primary-light: #9a76ff;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --border-color: #333333;
            --success: #4caf50;
            --danger: #f44336;
            --warning: #ff9800;
            --calendar-bg: #1e1e1e;
            --calendar-text: #ffffff;
            --calendar-hover: #2a2a2a;
            --calendar-today: rgba(124, 77, 255, 0.2);
            --calendar-has-mood: rgba(76, 175, 80, 0.1);
            --nav-bg: #1e1e1e;
            --note-card-bg: #1e1e1e;
            --card-header-text: #ffffff; /* Added for better visibility */
            --section-header-text: #ffffff; /* Added for better visibility */
        }

        /* Light Theme Variables */
        [data-theme="light"] {
            --bg-dark: #f5f5f5;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --calendar-bg: #ffffff;
            --calendar-text: #333333;
            --calendar-hover: #f0f0f0;
            --calendar-today: rgba(124, 77, 255, 0.1);
            --calendar-has-mood: rgba(76, 175, 80, 0.1);
            --nav-bg: #ffffff;
            --note-card-bg: #ffffff;
            --card-header-text: #333333; /* Added for better visibility */
            --section-header-text: #333333; /* Added for better visibility */
        }
        
        body {
            background-color: var(--bg-dark);
            font-family: 'Poppins', sans-serif;
            color: var(--text-primary);
            padding-bottom: 80px;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Mood Emojis */
        .mood-emoji {
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px;
            border-radius: 50%;
            background: rgba(124, 77, 255, 0.1);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .mood-emoji:hover {
            transform: translateY(-5px);
            background: rgba(124, 77, 255, 0.2);
        }
        .mood-selected {
            transform: scale(1.2) translateY(-5px);
            background: rgba(124, 77, 255, 0.3);
            box-shadow: 0 5px 15px rgba(124, 77, 255, 0.3);
        }
        
        /* Calendar */
        .calendar-day {
            width: 14.28%;
            height: 45px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            color: var(--calendar-text);
            background-color: var(--calendar-bg);
        }
        .calendar-day:hover {
            background-color: var(--calendar-hover);
        }
        .calendar-day.today {
            background-color: var(--calendar-today);
            font-weight: 600;
            color: var(--primary-light);
        }
        .calendar-day.has-mood {
            background-color: var(--calendar-has-mood);
        }
        .calendar-day.has-notes {
            position: relative;
        }
        .calendar-day.has-notes::after {
            content: "📝";
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 0.7rem;
        }
        
        /* Cards */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .card-header {
            background-color: rgba(124, 77, 255, 0.2);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--card-header-text); /* Added for better visibility */
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        /* Section Headers - Fix for visibility */
        .section-header {
            color: var(--section-header-text) !important;
            font-weight: 600;
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--nav-bg);
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.1);
            padding: 12px 0;
            z-index: 1000;
            transition: background-color 0.3s ease;
        }
        .nav-icon {
            font-size: 1.5rem;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }
        .nav-icon.active {
            color: var(--primary-light);
            transform: translateY(-5px);
        }
        .nav-label {
            font-size: 0.7rem;
            margin-top: 3px;
            color: var(--text-secondary);
        }
        .nav-icon.active + .nav-label {
            color: var(--primary-light);
        }
        
        /* Notes */
        .note-card {
            background-color: var(--note-card-bg);
            border-left: 4px solid var(--primary);
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .note-card:hover {
            transform: translateX(5px);
        }
        .note-card .card-text {
            color: var(--text-primary); /* Explicit text color */
        }
        .note-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        #notes-container {
            max-height: 300px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-card);
        }
        #notes-container::-webkit-scrollbar {
            width: 6px;
        }
        #notes-container::-webkit-scrollbar-track {
            background: var(--bg-card);
        }
        #notes-container::-webkit-scrollbar-thumb {
            background-color: var(--primary);
            border-radius: 6px;
        }
        
        /* Form Elements */
        .form-control, .form-control:focus {
            background-color: var(--bg-card-hover);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(124, 77, 255, 0.25);
        }
        .btn-primary {
            background-color: var(--primary);
            border: none;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 10px 20px;
        }
        .btn-primary:hover {
            background-color: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(124, 77, 255, 0.3);
        }
        
        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
            color: var(--text-primary); /* Ensure headers are visible */
        }
        .text-muted {
            color: var(--text-secondary) !important;
        }
        
        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .floating {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Date Picker */
        .date-picker {
            background-color: var(--bg-card-hover);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 8px;
            max-width: 150px;
        }
        
        /* Settings Modal */
        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .settings-modal.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .settings-content {
            background-color: var(--bg-card);
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        
        .settings-modal.active .settings-content {
            transform: translateY(0);
        }
        
        .settings-option {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            transition: background-color 0.2s ease;
            color: var(--text-primary);
            text-decoration: none;
        }
        
        .settings-option:hover {
            background-color: rgba(124, 77, 255, 0.1);
        }
        
        .settings-option i {
            margin-right: 15px;
            font-size: 1.2rem;
            color: var(--primary-light);
        }
        
        .settings-option.logout {
            color: var(--danger);
        }
        
        .settings-option.logout i {
            color: var(--danger);
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .close-settings {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        /* Theme Toggle Switch */
        .theme-toggle {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
            margin-left: 10px;
        }
        
        .theme-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .theme-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .theme-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .theme-slider {
            background-color: var(--primary);
        }
        
        input:checked + .theme-slider:before {
            transform: translateX(26px);
        }
        
        /* Responsive Adjustments */
        @media (max-width: 576px) {
            .mood-emoji {
                width: 50px;
                height: 50px;
                font-size: 2rem;
            }
            .calendar-day {
                height: 40px;
                font-size: 0.8rem;
            }
            .settings-content {
                width: 95%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container py-3">
        <!-- Greeting Header -->
        <div class="text-center mb-4 mt-3">
            <h1 id="greeting" class="floating section-header">Hey, User</h1>
            <p class="text-muted mb-0" id="current-date"></p>
        </div>

        <!-- Mood Tracker -->
        <div class="card mb-4">
            <div class="card-header">
                <i class="bi bi-emoji-smile me-2"></i><span class="section-header">Today's Mood</span>
            </div>
            <div class="card-body">
                <div class="d-flex justify-content-around">
                    <div class="mood-emoji" data-mood="sad" title="Sad">😞</div>
                    <div class="mood-emoji" data-mood="neutral" title="Neutral">😐</div>
                    <div class="mood-emoji" data-mood="happy" title="Happy">😊</div>
                    <div class="mood-emoji" data-mood="excited" title="Excited">😃</div>
                    <div class="mood-emoji" data-mood="love" title="Love">😍</div>
                </div>
            </div>
        </div>

        <!-- Calendar View -->
        <div class="card mb-4">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <button class="btn btn-sm btn-outline-primary" id="prev-month">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <h5 class="mb-0 section-header" id="current-month">May 2025</h5>
                    <button class="btn btn-sm btn-outline-primary" id="next-month">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div class="card-body p-2">
                <div class="d-flex mb-2">
                    <div class="calendar-day text-muted" style="width: 14.28%">S</div>
                    <div class="calendar-day text-muted" style="width: 14.28%">M</div>
                    <div class="calendar-day text-muted" style="width: 14.28%">T</div>
                    <div class="calendar-day text-muted" style="width: 14.28%">W</div>
                    <div class="calendar-day text-muted" style="width: 14.28%">T</div>
                    <div class="calendar-day text-muted" style="width: 14.28%">F</div>
                    <div class="calendar-day text-muted" style="width: 14.28%">S</div>
                </div>
                <div id="calendar-days" class="d-flex flex-wrap"></div>
            </div>
        </div>

        <!-- Journal Notes Section -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-journal-text me-2"></i><span class="section-header">Journal Notes</span></span>
                <input type="date" id="note-date-picker" class="form-control form-control-sm date-picker">
            </div>
            <div class="card-body">
                <div id="notes-container" class="mb-3">
                    <!-- Notes will be displayed here -->
                </div>
                <textarea class="form-control mb-3" id="journal-note" rows="3" placeholder="How was your day?"></textarea>
                <button class="btn btn-primary w-100" id="save-note">
                    <i class="bi bi-plus-circle me-2"></i>Add Note
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="container">
            <div class="d-flex justify-content-around">
                <a href="#" class="text-center text-decoration-none">
                    <div class="nav-icon active">
                        <i class="bi bi-house-door-fill"></i>
                    </div>
                    <div class="nav-label">Home</div>
                </a>
                <a href="#" class="text-center text-decoration-none">
                    <div class="nav-icon">
                        <i class="bi bi-plus-circle"></i>
                    </div>
                    <div class="nav-label">Add</div>
                </a>
                <a href="#" class="text-center text-decoration-none">
                    <div class="nav-icon">
                        <i class="bi bi-bar-chart-line"></i>
                    </div>
                    <div class="nav-label">Stats</div>
                </a>
                <a href="#" id="settings-btn" class="text-center text-decoration-none">
                    <div class="nav-icon">
                        <i class="bi bi-gear-fill"></i>
                    </div>
                    <div class="nav-label">Settings</div>
                </a>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <div class="settings-header">
                <h5 class="mb-0 section-header">Settings</h5>
                <button class="close-settings" id="close-settings">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            
            <div class="settings-option">
                <i class="bi bi-person"></i>
                <span>Account Settings</span>
            </div>
            
            <div class="settings-option">
                <i class="bi bi-bell"></i>
                <span>Notifications</span>
            </div>
            
            <div class="settings-option d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <i class="bi bi-palette"></i>
                    <span>Theme</span>
                </div>
                <label class="theme-toggle">
                    <input type="checkbox" id="theme-toggle">
                    <span class="theme-slider"></span>
                </label>
            </div>
            
            <a href="#" class="settings-option logout" id="logout-btn">
                <i class="bi bi-box-arrow-right"></i>
                <span>Log Out</span>
            </a>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize elements
            const greetingElement = document.getElementById('greeting');
            const currentDateElement = document.getElementById('current-date');
            const moodEmojis = document.querySelectorAll('.mood-emoji');
            const calendarDays = document.getElementById('calendar-days');
            const currentMonthElement = document.getElementById('current-month');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');
            const journalNote = document.getElementById('journal-note');
            const saveNoteBtn = document.getElementById('save-note');
            const notesContainer = document.getElementById('notes-container');
            const datePicker = document.getElementById('note-date-picker');
            const themeToggle = document.getElementById('theme-toggle');
            
            // Settings Modal Elements
            const settingsBtn = document.getElementById('settings-btn');
            const settingsModal = document.getElementById('settings-modal');
            const closeSettings = document.getElementById('close-settings');
            const logoutBtn = document.getElementById('logout-btn');
            
            // Get current user
            const currentUserEmail = localStorage.getItem('currentUser');
            const userDatabase = JSON.parse(localStorage.getItem('userDatabase')) || {};
            const currentUser = userDatabase[currentUserEmail] || {};
            
            // Set greeting
            if (currentUserEmail) {
                const username = currentUserEmail.split('@')[0];
                greetingElement.textContent = `Hey, ${username.charAt(0).toUpperCase() + username.slice(1)}`;
            }
            
            // Set current date
            const today = new Date();
            currentDateElement.textContent = today.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            
            // Set date picker to today
            datePicker.valueAsDate = today;
            
            // Check for saved theme preference
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeToggle.checked = savedTheme === 'light';
            
            // Theme toggle functionality
            themeToggle.addEventListener('change', function() {
                if (this.checked) {
                    document.documentElement.setAttribute('data-theme', 'light');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
            
            // Mood Tracker
            moodEmojis.forEach(emoji => {
                emoji.addEventListener('click', function() {
                    // Remove selected class from all
                    moodEmojis.forEach(e => e.classList.remove('mood-selected'));
                    // Add to clicked
                    this.classList.add('mood-selected');
                    
                    // Save mood to localStorage
                    const dateKey = `mood_${formatDate(today)}`;
                    const moodValue = this.getAttribute('data-mood');
                    localStorage.setItem(dateKey, moodValue);
                    
                    // Update calendar
                    generateCalendar(currentMonth, currentYear);
                });
            });
            
            // Check if mood is already set for today
            const todayMoodKey = `mood_${formatDate(today)}`;
            const todayMood = localStorage.getItem(todayMoodKey);
            if (todayMood) {
                const selectedEmoji = document.querySelector(`.mood-emoji[data-mood="${todayMood}"]`);
                if (selectedEmoji) {
                    selectedEmoji.classList.add('mood-selected');
                }
            }
            
            // Calendar
            let currentMonth = today.getMonth();
            let currentYear = today.getFullYear();
            
            function generateCalendar(month, year) {
                calendarDays.innerHTML = '';
                
                // Set month header
                currentMonthElement.textContent = new Date(year, month).toLocaleDateString('en-US', { 
                    month: 'long', 
                    year: 'numeric' 
                });
                
                // Get first day of month and total days
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                // Add empty cells for days before first day
                for (let i = 0; i < firstDay; i++) {
                    const emptyDay = document.createElement('div');
                    emptyDay.className = 'calendar-day';
                    calendarDays.appendChild(emptyDay);
                }
                
                // Add days of month
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayElement = document.createElement('div');
                    dayElement.className = 'calendar-day';
                    dayElement.textContent = day;
                    
                    const date = new Date(year, month, day);
                    const dateKey = `mood_${formatDate(date)}`;
                    const mood = localStorage.getItem(dateKey);
                    const notesKey = `notes_${formatDate(date)}`;
                    const hasNotes = localStorage.getItem(notesKey);
                    
                    // Highlight today
                    if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                        dayElement.classList.add('today');
                    }
                    
                    // Show mood if set
                    if (mood) {
                        dayElement.classList.add('has-mood');
                        dayElement.textContent = getMoodEmoji(mood);
                    }
                    
                    // Show note indicator if exists
                    if (hasNotes) {
                        dayElement.classList.add('has-notes');
                    }
                    
                    // Add click event to view notes for the day
                    dayElement.addEventListener('click', function() {
                        const clickedDate = new Date(year, month, day);
                        datePicker.valueAsDate = clickedDate;
                        loadNotesForDate(clickedDate);
                    });
                    
                    calendarDays.appendChild(dayElement);
                }
            }
            
            // Calendar navigation
            prevMonthBtn.addEventListener('click', function() {
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
                generateCalendar(currentMonth, currentYear);
            });
            
            nextMonthBtn.addEventListener('click', function() {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                generateCalendar(currentMonth, currentYear);
            });
            
            // Journal Notes System
            function loadNotesForDate(date) {
                const notesKey = `notes_${formatDate(date)}`;
                const notesJson = localStorage.getItem(notesKey);
                const notes = notesJson ? JSON.parse(notesJson) : [];
                
                notesContainer.innerHTML = '';
                
                if (notes.length === 0) {
                    notesContainer.innerHTML = '<p class="text-muted text-center py-3">No notes for this date</p>';
                    return;
                }
                
                // Sort notes by timestamp (newest first)
                notes.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                
                notes.forEach(note => {
                    const noteElement = document.createElement('div');
                    noteElement.className = 'card note-card';
                    noteElement.innerHTML = `
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <div class="note-time">
                                    <i class="bi bi-clock me-1"></i>
                                    ${new Date(note.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                </div>
                                <button class="btn btn-sm btn-outline-danger delete-note" data-timestamp="${note.timestamp}">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                            <p class="card-text mb-0">${note.text}</p>
                        </div>
                    `;
                    notesContainer.appendChild(noteElement);
                });
                
                // Add event listeners to delete buttons
                document.querySelectorAll('.delete-note').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const timestamp = this.getAttribute('data-timestamp');
                        deleteNote(date, timestamp);
                    });
                });
            }
            
            function deleteNote(date, timestamp) {
                const notesKey = `notes_${formatDate(date)}`;
                const notesJson = localStorage.getItem(notesKey);
                let notes = notesJson ? JSON.parse(notesJson) : [];
                
                // Filter out the note to delete
                notes = notes.filter(note => note.timestamp !== timestamp);
                
                // Save back to localStorage
                if (notes.length > 0) {
                    localStorage.setItem(notesKey, JSON.stringify(notes));
                } else {
                    localStorage.removeItem(notesKey);
                }
                
                // Reload notes
                loadNotesForDate(date);
                
                // Update calendar
                generateCalendar(currentMonth, currentYear);
            }
            
            // Date picker change handler
            datePicker.addEventListener('change', function() {
                const selectedDate = new Date(this.value);
                loadNotesForDate(selectedDate);
            });
            
            // Save note button
            saveNoteBtn.addEventListener('click', function() {
                const noteText = journalNote.value.trim();
                if (noteText) {
                    const selectedDate = new Date(datePicker.value);
                    const notesKey = `notes_${formatDate(selectedDate)}`;
                    
                    // Get existing notes or create new array
                    const notesJson = localStorage.getItem(notesKey);
                    const notes = notesJson ? JSON.parse(notesJson) : [];
                    
                    // Add new note with timestamp
                    notes.push({
                        text: noteText,
                        timestamp: new Date().toISOString()
                    });
                    
                    // Save back to localStorage
                    localStorage.setItem(notesKey, JSON.stringify(notes));
                    
                    // Clear input
                    journalNote.value = '';
                    
                    // Reload notes
                    loadNotesForDate(selectedDate);
                    
                    // Update calendar
                    generateCalendar(currentMonth, currentYear);
                }
            });
            
            // Settings Modal Functionality
            settingsBtn.addEventListener('click', function(e) {
                e.preventDefault();
                settingsModal.classList.add('active');
            });
            
            closeSettings.addEventListener('click', function() {
                settingsModal.classList.remove('active');
            });
            
            logoutBtn.addEventListener('click', function(e) {
                e.preventDefault();
                // Clear current user session
                localStorage.removeItem('currentUser');
                // Redirect to login page
                window.location.href = 'login.html';
            });
            
            // Close modal when clicking outside
            settingsModal.addEventListener('click', function(e) {
                if (e.target === settingsModal) {
                    settingsModal.classList.remove('active');
                }
            });
            
            // Helper functions
            function formatDate(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            
            function getMoodEmoji(mood) {
                switch(mood) {
                    case 'sad': return '😞';
                    case 'neutral': return '😐';
                    case 'happy': return '😊';
                    case 'excited': return '😃';
                    case 'love': return '😍';
                    default: return '';
                }
            }
            
            // Initialize calendar and load today's notes
            generateCalendar(currentMonth, currentYear);
            loadNotesForDate(today);
        });
    </script>
</body>
