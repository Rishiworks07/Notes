<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 25% 25%, rgba(33, 150, 243, 0.1) 0%, transparent 50%),
                              radial-gradient(circle at 75% 75%, rgba(233, 30, 99, 0.1) 0%, transparent 50%);
        }
        .signup-container {
            max-width: 500px;
            margin-left: 400px;
            width: 90%;
            padding: 30px;
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateY(-20px);
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(-20px); }
            50% { transform: translateY(-30px); }
            100% { transform: translateY(-20px); }
        }
        .form-control {
            background-color: rgba(45, 45, 45, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .btn-primary {
            background-color: #2196F3;
            border: none;
        }
        .password-strength {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            margin: -10px 0 15px;
            border-radius: 2px;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .alert {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="signup-container">
            <h2 class="text-center mb-4 text-white">Create Account</h2>
            
            <form id="signupForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label text-white-50">First Name</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label text-white-50">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label text-white-50">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label text-white-50">Password</label>
                    <input type="password" class="form-control" id="password" required>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrength"></div>
                    </div>
                    <small class="text-white-50">At least 8 characters with numbers and symbols</small>
                </div>
                
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label text-white-50">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>
                
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label text-white-50" for="terms">
                        I agree to the <a href="#" class="text-primary">Terms</a> and <a href="#" class="text-primary">Privacy Policy</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Sign Up</button>
                
                <p class="text-center text-white-50">Already have an account? <a href="login.html" class="text-primary">Log In</a></p>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Password strength indicator
            const passwordInput = document.getElementById('password');
            const strengthBar = document.getElementById('passwordStrength');
            
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                let strength = 0;
                
                // Length check
                if (password.length >= 8) strength += 25;
                if (password.length >= 12) strength += 25;
                
                // Complexity checks
                if (/[A-Z]/.test(password)) strength += 15;
                if (/[0-9]/.test(password)) strength += 15;
                if (/[^A-Za-z0-9]/.test(password)) strength += 20;
                
                // Update strength bar
                strength = Math.min(strength, 100);
                strengthBar.style.width = strength + '%';
                
                // Change color based on strength
                if (strength < 40) {
                    strengthBar.style.backgroundColor = '#f44336';
                } else if (strength < 70) {
                    strengthBar.style.backgroundColor = '#ff9800';
                } else {
                    strengthBar.style.backgroundColor = '#4caf50';
                }
            });
            
            // Form submission
            const signupForm = document.getElementById('signupForm');
            signupForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                // Validate form
                if (!firstName || !lastName || !email || !password || !confirmPassword) {
                    showAlert('Please fill in all fields', 'danger');
                    return;
                }
                
                if (!validateEmail(email)) {
                    showAlert('Please enter a valid email', 'danger');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showAlert('Passwords do not match', 'danger');
                    return;
                }
                
                if (password.length < 8) {
                    showAlert('Password must be at least 8 characters', 'danger');
                    return;
                }
                
                // Get existing users or create new database
                const userDatabase = JSON.parse(localStorage.getItem('userDatabase')) || {};
                
                // Check if user already exists
                if (userDatabase[email]) {
                    showAlert('Email already registered', 'danger');
                    return;
                }
                
                // Simple hash function for demo purposes
                function simpleHash(str) {
                    let hash = 0;
                    for (let i = 0; i < str.length; i++) {
                        const char = str.charCodeAt(i);
                        hash = (hash << 5) - hash + char;
                        hash |= 0; // Convert to 32bit integer
                    }
                    return hash.toString();
                }
                
                // Store user data (in real app, only store hashed password server-side)
                userDatabase[email] = {
                    firstName: firstName,
                    lastName: lastName,
                    password: password, // Store hashed version
                    createdAt: new Date().toISOString()
                };
                
                // Save to localStorage
                localStorage.setItem('userDatabase', JSON.stringify(userDatabase));
                
                // Show success and redirect
                showAlert('Account created successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            });
            
            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
            
            function showAlert(message, type) {
                // Remove existing alerts
                const existingAlert = document.querySelector('.alert');
                if (existingAlert) existingAlert.remove();
                
                // Create alert
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type}`;
                alertDiv.textContent = message;
                
                // Insert after form
                signupForm.appendChild(alertDiv);
                
                // Auto-hide
                if (type !== 'danger') {
                    setTimeout(() => {
                        alertDiv.remove();
                    }, 3000);
                }
            }
        });
    </script>
</body>
</html>
